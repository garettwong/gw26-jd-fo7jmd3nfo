<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta name="theme-color" content="#0f7074"><link rel="icon" href="../../../favicon-32.png"><title>Private salary report</title>
<style>
:root{--ink:#1d2734;--muted:#667387;--line:#d7dee8;--paper:#fff;--bg:#eef1f6;--teal:#0f7074;--orange:#f2a33a;--red:#b42318}*{box-sizing:border-box}html{background:var(--bg);color:var(--ink);font:15px/1.4 "Segoe UI",Arial,sans-serif;letter-spacing:0}body{margin:0}header{background:#fff;border-bottom:1px solid var(--line);border-top:6px solid var(--teal)}.bar,main{max-width:1040px;margin:auto;padding-left:20px;padding-right:20px}.bar{padding-top:18px;padding-bottom:18px;display:flex;align-items:center;gap:14px}.copy{flex:1;min-width:0}h1{font-size:24px;margin:0}.sub{color:var(--muted);margin:4px 0 0}.nav{display:flex;gap:7px}.nav a{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font:inherit;font-weight:800;text-decoration:none;white-space:nowrap}.nav a:hover,.nav a:focus-visible{background:#e9f5f4;outline:0}.modes{display:flex;gap:6px;margin:22px 0 14px}.modes button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 12px;border-radius:6px;font:inherit;font-weight:700}.modes button.active{background:var(--teal);border-color:var(--teal);color:#fff}.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);background:#fff;border-radius:8px;margin-bottom:16px}.metric{padding:15px;border-right:1px solid var(--line)}.metric:last-child{border-right:0}.metric small{display:block;color:var(--muted);font-weight:700}.metric strong{display:block;font-size:24px;margin-top:4px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:right;padding:11px 12px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);background:#f7f9fb}th:first-child,td:first-child{text-align:left}tbody tr:last-child td{border-bottom:0}td.total{font-weight:850;color:var(--teal)}.notes{margin:18px 0 40px;color:var(--muted)}.notes h2{font-size:14px;color:var(--ink)}.notes li{margin:5px 0}.hidden{display:none}@media(max-width:620px){.bar,main{padding-left:12px;padding-right:12px}.bar{align-items:flex-start;flex-wrap:wrap}.copy{width:100%}.nav{width:100%}.nav a{width:100%}.summary{grid-template-columns:1fr}.metric{border-right:0;border-bottom:1px solid var(--line)}.metric:last-child{border-bottom:0}.metric strong{font-size:21px}.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.modes button{padding:10px 4px;font-size:12px}}
</style>
<style>
.bar,main{max-width:1120px}.expected{margin-top:22px}.expected-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:9px}.expected h2{font-size:18px;margin:0}.expected-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.received-controls{display:flex;align-items:center;justify-content:flex-end;gap:9px;flex-wrap:wrap}.received-toggle{min-height:36px;padding:7px 11px;border:1px solid var(--teal);border-radius:6px;background:#fff;color:var(--teal);font:inherit;font-size:12px;font-weight:850}.received-toggle[aria-pressed="true"]{background:var(--teal);color:#fff}.received-summary{color:var(--muted);font-size:11px}.received-payment{background:#f2f7f6}.received-badge{display:inline-block;margin-left:7px;padding:2px 5px;border-radius:4px;background:#48756f;color:#fff;font-size:9px;font-weight:900}.expected-table{min-width:900px}.expected-table th,.expected-table td{text-align:left;vertical-align:top}.expected-table th:last-child,.expected-table td:last-child{text-align:right}.pay-kind{display:inline-block;min-width:38px;margin-right:7px;padding:2px 5px;border-radius:4px;background:var(--teal);color:#fff;font-size:10px;font-weight:900;text-align:center}.pay-kind.sen{background:#247e9b}.pay-label{font-weight:850}.pay-course{display:block;color:var(--muted);font-size:11px}.pay-date{font-weight:850;color:var(--teal);white-space:nowrap}.pay-basis{color:var(--muted);font-size:11px}.undated{margin-top:9px;padding:10px 12px;border:1px solid #e8c78f;border-radius:7px;background:#fff7e8;color:#7d4d00;font-size:12px}@media(max-width:620px){.expected-head{display:block}.received-controls{align-items:stretch;justify-content:stretch;margin-top:9px}.received-toggle{width:100%}.received-summary{width:100%}.expected .table-wrap{overflow:visible;border:0;background:transparent}.expected-table{display:block;min-width:0}.expected-table thead{display:none}.expected-table tbody{display:grid;gap:8px}.expected-table tr{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding:10px;border:1px solid var(--line);border-radius:7px;background:#fff}.expected-table tr.received-payment{background:#f2f7f6}.expected-table td{display:block;padding:0!important;border:0!important;text-align:left!important}.expected-table td:first-child{grid-column:1/-1}.expected-table td::before{display:block;margin-bottom:2px;color:var(--muted);font-size:9px;font-weight:850;text-transform:uppercase}.expected-table td:nth-child(2)::before{content:"可開單日"}.expected-table td:nth-child(3)::before{content:"預計到賬日"}.expected-table td:nth-child(4)::before{content:"計算依據"}.expected-table td:nth-child(5)::before{content:"金額"}.expected-table td:nth-child(5){font-size:15px}.pay-course{margin-top:2px}}
</style></head><body><div id="app" class="hidden"><header><div class="bar"><div class="copy"><h1 id="title"></h1><p class="sub" id="subtitle"></p></div><div class="nav"><a href="../../">Versions</a></div></div></header><main><div class="modes"><button type="button" data-mode="confirmed" class="active">Confirmed</button><button type="button" data-mode="confirmed_and_unconfirmed">Confirmed + unconfirmed</button><button type="button" data-mode="remaining">尚未收取</button></div><section class="summary"><div class="metric"><small id="grandLabel">Total earnings</small><strong id="grand"></strong></div><div class="metric"><small id="eventsLabel">Counted source entries</small><strong id="events"></strong></div></section><div id="monthlyTable" class="table-wrap"><table><thead><tr><th>Month</th><th>ERB/SEN hours</th><th>ERB/SEN pay</th><th>DGS hours</th><th>DGS pay</th><th>Total</th></tr></thead><tbody id="rows"></tbody></table></div><section class="expected"><div class="expected-head"><div><h2>預計薪酬到賬日</h2><p>ERB：全班完結後 21 日；SEN：月結後 7 日。這是規劃日期，並非會計保證日期。</p></div><div class="received-controls"><button id="receivedToggle" class="received-toggle" type="button" aria-pressed="false"></button><span id="receivedSummary" class="received-summary"></span></div></div><div class="table-wrap"><table class="expected-table"><thead><tr><th>課程／月份</th><th>可開單日</th><th>預計到賬日</th><th>計算依據</th><th>金額</th></tr></thead><tbody id="expectedRows"></tbody></table></div><div id="undated" class="undated" hidden></div></section><section class="notes"><h2>Calculation rules</h2><ul id="notes"></ul></section></main></div>
<script>
const STORAGE_KEY='garetts-erb-earnings-key-v1';
const dec=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
const money=n=>new Intl.NumberFormat('en-HK',{style:'currency',currency:'HKD',maximumFractionDigits:0}).format(n);
const hours=n=>Number.isInteger(n)?String(n):n.toFixed(2).replace(/0+$/,'').replace(/\.$/,'');
function candidate(){const hash=location.hash.slice(1);const fromHash=hash.replace(/^key=/,'');return fromHash||localStorage.getItem(STORAGE_KEY)||''}
async function start(){
  try{
    const raw=candidate();
    if(!raw){location.replace('../../');return}
    const key=await crypto.subtle.importKey('raw',dec(raw),'AES-GCM',false,['decrypt']);
    const enc=await fetch('earnings.enc.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Missing encrypted report');return r.json()});
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(enc.nonce),additionalData:new TextEncoder().encode('erb-earnings-v1')},key,dec(enc.ciphertext));
    const data=JSON.parse(new TextDecoder().decode(plain));
    const esc=x=>String(x||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    localStorage.setItem(STORAGE_KEY,raw);
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('title').textContent=data.name+' - Salary';
    document.getElementById('subtitle').textContent=data.period+' · '+data.version+' · Updated '+data.generated;
    document.getElementById('notes').innerHTML=data.notes.map(x=>'<li>'+esc(x)+'</li>').join('');
    const receivedStorageKey='garetts-erb-show-received-v2';
    let showReceived=localStorage.getItem(receivedStorageKey)==='1';
    let activeMode='confirmed';
    const receivedToggle=document.getElementById('receivedToggle');
    function renderExpected(schedule,remainingOnly=false){
      const receivedRows=schedule.rows.filter(r=>r.received);
      const receivedUndated=schedule.undated.filter(r=>r.received);
      const receivedItems=[...receivedRows,...receivedUndated];
      const receivedAmount=receivedItems.reduce((total,r)=>total+r.amount,0);
      const unpaidRows=schedule.rows.filter(r=>!r.received);
      const unpaidUndated=schedule.undated.filter(r=>!r.received);
      const unpaidItems=[...unpaidRows,...unpaidUndated];
      const visibleRows=remainingOnly?unpaidRows:(showReceived?schedule.rows:unpaidRows);
      const visibleUndated=remainingOnly?unpaidUndated:(showReceived?schedule.undated:unpaidUndated);
      document.getElementById('expectedRows').innerHTML=visibleRows.map(r=>'<tr class="'+(r.received?'received-payment':'')+'"><td><span class="pay-kind '+(r.kind==='SEN'?'sen':'')+'">'+esc(r.kind)+'</span><span class="pay-label">'+esc(r.label)+'</span>'+(r.received?'<span class="received-badge">已收款</span>':'')+'<span class="pay-course">'+esc(r.course_name)+'</span></td><td>'+esc(r.invoice_date)+'</td><td class="pay-date">'+esc(r.expected_payment_date)+'</td><td><span class="pay-basis">'+esc(r.basis)+'</span><br>'+hours(r.hours)+' hours</td><td class="total">'+money(r.amount)+'</td></tr>').join('')||'<tr><td colspan="5">沒有尚未收取的款項。</td></tr>';
      const undated=document.getElementById('undated');
      undated.hidden=!visibleUndated.length;
      undated.innerHTML=visibleUndated.map(r=>'<strong>'+esc(r.label)+': '+money(r.amount)+'</strong>'+(r.received?'<span class="received-badge">已收款</span>':'')+' · '+esc(r.reason)).join('<br>');
      receivedToggle.hidden=remainingOnly||!receivedItems.length;
      receivedToggle.setAttribute('aria-pressed',String(showReceived));
      receivedToggle.textContent=(showReceived?'隱藏':'顯示')+'已收款項（'+receivedItems.length+'）';
      document.getElementById('receivedSummary').textContent=remainingOnly?'已扣除 '+receivedItems.length+' 筆已收款項，共 '+money(receivedAmount):(receivedItems.length?(showReceived?'正在顯示':'已隱藏')+' '+receivedItems.length+' 筆已收款項，共 '+money(receivedAmount):'');
      return {unpaidAmount:unpaidItems.reduce((total,r)=>total+r.amount,0),unpaidCount:unpaidItems.length};
    }
    function render(mode){
      activeMode=mode;
      const remaining=mode==='remaining';
      const d=remaining?data.confirmed:data[mode];
      const schedule=d.expected_payments||{rows:[],undated:[]};
      const paymentSummary=renderExpected(schedule,remaining);
      document.getElementById('grandLabel').textContent=remaining?'尚未收取薪酬':'Total earnings';
      document.getElementById('eventsLabel').textContent=remaining?'尚未收款項目':'Counted source entries';
      document.getElementById('grand').textContent=money(remaining?paymentSummary.unpaidAmount:d.grand_total);
      document.getElementById('events').textContent=remaining?paymentSummary.unpaidCount:d.counted_events;
      document.getElementById('rows').innerHTML=d.months.map(r=>'<tr><td>'+r.month+'</td><td>'+hours(r.regular_hours)+'</td><td>'+money(r.regular_pay)+'</td><td>'+hours(r.dgs_hours)+'</td><td>'+money(r.dgs_pay)+'</td><td class="total">'+money(r.total)+'</td></tr>').join('');
      document.getElementById('monthlyTable').hidden=remaining;
      document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
    }
    receivedToggle.onclick=()=>{
      showReceived=!showReceived;
      localStorage.setItem(receivedStorageKey,showReceived?'1':'0');
      render(activeMode);
    };
    document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>render(b.dataset.mode));
    render('confirmed');
  }catch(error){location.replace('../../')}
}
start();
</script></body></html>
